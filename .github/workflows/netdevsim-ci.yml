# Netdevsim CI for linuxptp-daemon.
#
# The harness (DKMS setup, image build, e2e scenarios) lives in
# ptp-operator and is called from there, so CI fixes only need to land
# in the ptp-operator repository. The harness detects which repository
# it is running for and builds the daemon image from this repository's
# checkout (see "Prepare CI harness" in ptp-operator's
# .github/workflows/netdevsim-ci.yml).
#
# NOTE: no `concurrency` here on purpose. The called workflow defines
# it (evaluated in caller context), and defining the same group in both
# the caller and the callee deadlocks the run.

name: Netdevsim CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  netdevsim-ci:
    uses: k8snetworkplumbingwg/ptp-operator/.github/workflows/netdevsim-ci.yml@main
